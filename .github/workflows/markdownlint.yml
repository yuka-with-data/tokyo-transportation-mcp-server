name: Markdown Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  markdownlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24.0.0
        with:
          globs: |
            **/*.md
