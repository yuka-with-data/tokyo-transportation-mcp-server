[project]
name = "tokyo-mcp-server"
version = "0.1.0"
description = "Tokyo Transit MCP Tools for Client UI"
requires-python = ">=3.10"

dependencies = [
    "mcp[cli]",
    "requests",
    "beautifulsoup4",
    "lxml",
    "spacy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pylint",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["tokyo_mcp*"]
