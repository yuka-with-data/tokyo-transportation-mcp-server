[project]
name = "tokyo-mcp-server"
version = "0.1.0"
description = "Tokyo Transit MCP Tools for Client UI"
requires-python = ">=3.10"

dependencies = [
    "mcp[cli]>=1.27,<2",
    "requests>=2.33,<3",
    "beautifulsoup4>=4.14,<5",
    "lxml>=6.1,<7",
    "spacy>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pylint>=3,<5",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["tokyo_mcp*"]
